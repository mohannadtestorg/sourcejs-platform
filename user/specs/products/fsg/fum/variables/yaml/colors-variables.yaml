---
# font
  global:
    type: "color/hez"
    category: "colors"
    cssProperties:
    - '*color'
    - 'background*'
    - 'border*'
  imports:
    - ../../../../../ux3/variables/aliases/colors.yaml
    - ../../../variables/aliases/colors.yaml
    - ../aliases/colors.yaml
  props:
    # backgrounds
    primary-bg-color:
      value: "{!FUM_BLUE_01}"
    issue-cover-color:
      value: "{!FUM_RED}"
    # text colors
    primary-text-color:
      value: "{!FUM_GREY_04}"
    secondary-text-color:
      value: "{!FUM_BLUE_02}"
    tertiary-text-color:
      value: "{!FUM_GREY}"
    light-text-color:
      value: "{!FUM_GREY_05}"
    # border colors
    primary-border-color:
      value: "{!FUM_GREY_01}"
    secondary-border-color:
      value: "{!FUM_GREY_02}"
    primary-link-color:
      value: "{!FUM_RED}"
    tertiary-bg-color:
      value: "{!FUM_BLUE_02}"
    tertiary-lighten-bg-color:
      value: "{!FUM_BLUE_01}"
    secondary-bg-color:
      value: "{!FUM_DARK_BLUE}"
    footer-bg-color:
      value: "{!FUM_DARK_BLUE}"
    section-header-color:
      value: "{!FUM_GREY_03}"
    teaser-border-color:
      value: "{!FUM_GREY_01}"
    #buttons
    primary-btn-color:
      value: "{!FUM_BLUE_01}"
    button-bg:
      value: "{!FUM_BLUE_01}"
    #Facets
    facets-applied:
      value: "{!FUM_BLUE_01}"
    menu-background:
      value: "{!FUM_DARK_BLUE}"
    menu-color:
      value: "{!FUM_GREY_07}"

    #LOI
    loi-banner-bg-color:
      value: "{!FUM_BLUE_01}"
    #Search
    search-bg-color:
      value: "{!FUM_BLUE_01}"
    #slideshow
    slider-nav-hover-bg-color:
      value: "{!FUM_BLUE_01}"
    #badge
    badge-type-bg-color:
      value: "{!WHITE}"
    badge-oa-bg-color:
      value: "{!FUM_GREEN_01}"
    badge-fa-bg-color:
      value: "{!FUM_BLUE_04}"
    badge-cme-bg-color:
      value: "{!FUM_GREY_06}"

    #eCommerce
    primary-commerce-color:
      value: "{!FUM_BLUE_02}"
    header-commerce-color:
      value: "{!FUM_RED}"

    #Profile
    profile-primary-color:
      value: "{!FUM_BLUE_02}"

    #Tables
    table-rowgroup-bg:
      value: "{!FUM_GREY_07}"
    table-rowgroup-text:
      value: "{!FUM_GREY_04}"