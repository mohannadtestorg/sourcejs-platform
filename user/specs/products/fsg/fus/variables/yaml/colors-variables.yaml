---
# font
  global:
    type: "color/hez"
    category: "colors"
    cssProperties:
    - '*color'
    - 'background*'
    - 'border*'
  imports:
    - ../../../../../ux3/variables/aliases/colors.yaml
    - ../../../variables/aliases/colors.yaml
    - ../aliases/colors.yaml
  props:
    # backgrounds
    primary-bg-color:
      value: "{!FUS_GREEN}"
    issue-cover-color:
      value: "{!FUS_GREY_03}"
    # text colors
    primary-text-color:
      value: "{!FUS_GREEN}"
    secondary-text-color:
      value: "{!FUS_GREEN}"
    tertiary-text-color:
      value: "{!FUS_GREY}"
    # border colors
    primary-border-color:
      value: "{!FUS_GREY_01}"
    secondary-border-color:
      value: "{!FUS_GREY_02}"
    primary-link-color:
      value: "{!FUS_ORANGE}"
    tertiary-bg-color:
     value: "{!FUS_GREEN}"
    tertiary-lighten-bg-color:
      value: "{!FUS_GREEN}"
    secondary-bg-color:
      value: "{!FUS_DARK_GREEN}"
    menu-background:
      value: "{!FUS_DARK_GREEN}"
    footer-bg-color:
      value: "{!FUS_DARK_GREEN}"
    section-header-color:
      value: "{!FUS_ORANGE}"
    teaser-border-color:
      value: "{!FUS_GREY_01}"


    #buttons
    primary-btn-color:
      value: "{!FUS_GREEN}"
    button-bg:
      value: "{!FUS_GREEN}"
    #Facets
    facets-applied:
      value: "{!FUS_GREEN}"


    #LOI
    loi-banner-bg-color:
      value: "{!FUS_GREEN}"
    #Search
    search-bg-color:
      value: "{!FUS_GREEN}"
    #slideshow
    slider-nav-hover-bg-color:
      value: "{!FUS_GREEN}"
    #badge
    badge-type-bg-color:
      value: "{!WHITE}"
    badge-oa-bg-color:
      value: "{!FUS_GREEN_01}"
    badge-fa-bg-color:
      value: "{!FUS_BLUE_01}"
    badge-cme-bg-color:
      value: "{!FUS_GREY_04}"

    #eCommerce
    primary-commerce-color:
      value: "{!FUS_GREEN}"
    header-commerce-color:
      value: "{!FUS_ORANGE}"

    #Profile
    profile-primary-color:
      value: "{!FUS_GREEN}"

    #Tables
    table-rowgroup-bg:
      value: "{!FUM_GREY_05}"
    table-rowgroup-text:
      value: "{!FUM_GREY_06}"