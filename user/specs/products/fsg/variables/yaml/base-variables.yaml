# font
  global:
    type: "size"
    category: "sizing"
    cssProperties:
    - 'font*'
  props:
    default-font-family:
      value: "'Open Sans', sans-serif"
    secondary-font-family:
      value: "'Roboto', sans-serif"
    tertiary-font-family:
      value: "'Lato', sans-serif"
    default-font-size:
      value: "1rem"
      suffix: "16px"
    h1-font-size:
      value: "1.625rem"
      suffix: "26px"
    h2-font-size:
      value: "1.375rem"
      suffix: "22px"
    h3-font-size:
      value: "1.25rem"
      suffix: "20px"
    h4-font-size:
      value: "1.125rem"
      suffix: "18px"
    h5-font-size:
      value: "1rem"
      suffix: "16px"
    h6-font-size:
      value: "0.875rem"
      suffix: "14px"
    icon-font-size:
      value: "1.125rem"
      suffix: "18px"
    gutter-size:
      value: "30px"