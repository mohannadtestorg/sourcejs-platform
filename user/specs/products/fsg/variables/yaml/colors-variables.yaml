---
# font
  global:
    type: "color/hez"
    category: "colors"
    cssProperties:
    - '*color'
    - 'background*'
    - 'border*'
  imports:
    - ../../../../ux3/variables/aliases/colors.yaml
    - ../aliases/colors.yaml
  props:
    # backgrounds
    primary-bg-color:
      value: "{!FSG_GREEN}"
    light-gray-bg:
      value: "{!LIGHT_GREY_BG}"
    lissue-cover-color:
      value: "{!FSG_GREY}"
    loi__banner_db_bg:
      value: "{!DARK_BLUE}"
    # text colors
    primary-text-color:
      value: "{!FSG_GREEN}"
    secondary-text-color:
      value: "{!FSG_ORANGE}"
    tertiary-text-color:
      value: "{!FSG_GREY}"
    light-text-color:
      value: "{!FUM_GREY_05}"
    loa-icon-color:
      value: "{!BLUE_01}"
    wslide_mobile_bg:
      value: "{!LIGHT_GREY_BG}"

    #shadows
    primary-shadow-color:
      value: "{!FSG_GREY}"
    # border colors
    primary-border-color:
      value: "{!FSG_GREY_01}"
    secondary-border-color:
      value: "{!FSG_GREY_02}"
    primary-link-color:
      value: "{!FSG_ORANGE}"
    text-onLight:
      value: "{!WHITE}"
    footer-color:
      value: "{!WHITE}"
    teaser-text-color:
      value: "{!FSG_GREY}"
    base-text-color:
      value: "{!GRAY}"

    #eCommerce
    primary-commerce-color:
      value: "{!FSG_GREEN}"
    header-commerce-color:
      value: "{!FSG_ORANGE}"
    item-added:
      value: "{!LIGHT_GREEN}"
    item-hover:
      value: "{!LIGHT_BLUE}"
    item-border:
      value: "{!BORDER_GREY}"
    checkout-hover:
      value: "{!DARK_BLUE_01}"
    black:
      value: "{!BLACK}"
    white:
      value: "{!WHITE}"
    red:
      value: "{!RED}"
    dark-grey:
      value: "{!DARK_GREY}"