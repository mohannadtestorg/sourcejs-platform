# global: shared properties between all variables unless it has been overriden
# type: type of variables
# cssProperties css properties that might  use those variables
# jsGroupe: Js object groupe name
# value: the value of the variable
# extension: extra text to be added at the end of the variable value ( will be added only in SCSS transformed values )
# comment: commemnt line to be added above the variable
# jsExport: detremin if the variable must be exposed /transformed to js object
# suffix: comment to be added at the end of the line in SCSS transformed file
---
# font
  global:
    type: "size"
    category: "sizing"
    cssProperties:
    - 'font*'
  jsGroupe: "base"
  strip: "false"
  props:
  # Font values from MAL style guide: http://testatyponlol.liebertpub.com/styleguide/liebertstyleguide.html
    default-font-family:
      value: "'Roboto', 'Helvetica Neue', Arial, sans-serif;"
    default-heading-font-family:
      value: "'Roboto Condensed', sans-serif"
    secondary-heading-font-family:
      value: "'Roboto', sans-serif"
    default-font-size:
      value: "1rem"
      suffix: "16px"
    h1-font-size:
      value: "2.3rem"
      suffix: "38px"
    h2-font-size:
      value: "2rem"
      suffix: "32px"
    h3-font-size:
      value: "1.75rem"
      suffix: "28px"
    h4-font-size:
      value: "1.5rem"
      suffix: "24px"
    h5-font-size:
      value: "1.2rem"
      suffix: "19px"
    h6-font-size:
      value: "1rem"
      suffix: 16px"
    icon-font-size:
      value: "1.125rem"
      suffix: "18px"
    small-font-size:
      value: "0.8rem"
      suffix: "22px"
    gutter-size:
      value: "30px"
    gutter-extra-size:
      value: "60px"
