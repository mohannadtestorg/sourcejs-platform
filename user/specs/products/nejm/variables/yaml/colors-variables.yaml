---
# font
  global:
    type: "color/hez"
    category: "colors"
    cssProperties:
    - '*color'
    - 'background*'
    - 'border*'
  imports:
    - ../aliases/colors.yaml
  props:

    color__accent:
      value: "{!color__orange}"
    color__accent--hove:
      value: "{!color__orange--darker}"
    color__text--headlines:
      value: "{!color__black--90}"
    color__text:
        value: "{!color__black--70}"
    color__text--secondary:
        value: "{!color__black--80}"
    color__text--tertiary:
        value: "{!color__black--60}"
    color__text--quaternary:
        value: "{!color__black--40}"
    color__link-primary:
        value: "{!color__blue}"
    color__link-primary--hover:
        value: "{!color__blue--darker}"
    color__tag--moc:
            value: "{!color__teal}"
    color__tag--free:
            value: "{!color__purple}"
    color__tag--cme:
            value: "{!color__taupe}"
    color__rules:
                value: "{!color__black--10}"
    color__input-border:
                value: "{!color__black--20}"
    color__input-border--hover:
                value: "{!color__black--30}"
    color__input-border--focus:
                value: "{!color__black--90}"
    color__background:
                value: "{!color__black--4}"
    color__background--badge:
                value: "{!color__glaciablue}"
    color__background--widget:
                value: "{!color__beige}"
    color__background--alert:
                value: "{!color__magnolia}"
    color__background--tooltip:
                value: "{!color__black--80}"
    color__promo-accent:
                value: "{!color__powder-blue}"


