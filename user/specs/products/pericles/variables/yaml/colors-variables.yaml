  props:
    # UI Polish
    wiley-blue-color:
      value: "{!WILEY_BLUE_02}"
    wiley-darkBlue-color:
      value: "{!WILEY_BLUE_03}"
    menu-background:
      value: "{!WILEY_BLUE_02}"

    wiley-green-color:
      value: "{!WILEY_GREEN_01}"
    wiley-lightGray-color:
      value: "{!WILEY_GRAY_00}"
    wiley-extralightGray-color:
      value: "{!WILEY_GRAY_0}"
    wiley-gray-color:
      value: "{!WILEY_GRAY_03}"
    wiley-gray-text-color:
      value: "{!WILEY_GRAY_08}"
    wiley-darkGray-text-color:
      value: "{!WILEY_GRAY_10}"
    wiley-gray-lighter-separator:
